<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0c07; --bg2: #1a1208; --border: #3d2e12;
    --amber: #e8a020; --amber2: #f5c842;
    --green: #4caf50; --text: #ffffff; --text-dim: #aaaaaa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Space Mono', monospace;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; gap: 16px;
  }
  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px; letter-spacing: 3px; color: var(--amber);
  }
  .distance {
    font-size: 11px; color: var(--text-dim); letter-spacing: 2px;
  }
  .distance span { color: var(--text); font-size: 20px; }

  .compass-ring {
    width: 260px; height: 260px; border-radius: 50%;
    border: 2px solid var(--border);
    background: radial-gradient(circle at center, #241a0a 0%, #0e0c07 70%);
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.5);
  }
  .compass-ring::before {
    content: ''; position: absolute; inset: 10px;
    border-radius: 50%; border: 1px solid var(--border);
  }
  .cardinal {
    position: absolute; font-size: 12px; font-weight: 700;
  }
  .cardinal.n { top: 14px; left: 50%; transform: translateX(-50%); color: var(--amber); }
  .cardinal.s { bottom: 14px; left: 50%; transform: translateX(-50%); color: var(--text-dim); }
  .cardinal.e { right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }
  .cardinal.w { left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }

  .arrow-wrap {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    transform-origin: 0px 0px;
    transition: transform 1s ease; /* transición suave de 1 segundo */
  }
  .arrow-head {
    position: absolute;
    width: 0; height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-bottom: 24px solid var(--amber2);
    left: -10px; top: -90px;
    filter: drop-shadow(0 0 6px rgba(245,200,66,0.9));
  }
  .arrow-body-up {
    position: absolute;
    width: 6px; height: 66px;
    background: linear-gradient(to top, var(--amber) 0%, var(--amber2) 100%);
    border-radius: 3px;
    left: -3px; top: -66px;
    filter: drop-shadow(0 0 4px rgba(232,160,32,0.6));
  }
  .arrow-body-down {
    position: absolute;
    width: 6px; height: 50px;
    background: linear-gradient(to bottom, #666 0%, transparent 100%);
    border-radius: 3px;
    left: -3px; top: 0px;
  }
  .compass-center {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 14px rgba(232,160,32,0.9);
    z-index: 10;
  }

  /* Contador de actualización */
  .update-ring {
    width: 260px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 9px; color: var(--text-dim); letter-spacing: 1px;
  }
  .update-dots { display: flex; gap: 4px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--border); transition: background 0.3s;
  }
  .dot.active { background: var(--amber); }

  .info-box {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 20px;
    font-size: 10px; color: var(--text-dim);
    text-align: center; line-height: 2.2; width: 280px;
  }
  .info-box span { color: var(--amber); font-weight: 700; }
  .info-box .ok { color: var(--green); }
  .info-box .err { color: #e53935; }

  .arrived {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px; letter-spacing: 4px; color: var(--green);
    text-shadow: 0 0 20px rgba(76,175,80,0.5);
    display: none;
  }
  .arrived.visible { display: block; }

  .log {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px;
    font-size: 9px; color: var(--text-dim);
    width: 280px; max-height: 100px; overflow-y: auto;
    line-height: 1.8;
  }
</style>
</head>
<body>

  <div class="title">DESTINO: Campos</div>
  <div class="distance">DISTANCIA: <span id="dist">--</span> m</div>

  <div class="compass-ring">
    <span class="cardinal n">N</span>
    <span class="cardinal s">S</span>
    <span class="cardinal e">E</span>
    <span class="cardinal w">O</span>
    <div class="arrow-wrap" id="arrow-wrap">
      <div class="arrow-body-down"></div>
      <div class="arrow-body-up"></div>
      <div class="arrow-head"></div>
    </div>
    <div class="compass-center"></div>
  </div>

  <!-- 5 puntos = 5 segundos de acumulación -->
  <div class="update-ring">
    ACUMULANDO
    <div class="update-dots">
      <div class="dot" id="d0"></div>
      <div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div>
      <div class="dot" id="d3"></div>
      <div class="dot" id="d4"></div>
    </div>
    ACTUALIZANDO
  </div>

  <div class="arrived" id="arrived">¡LLEGASTE!</div>

  <div class="info-box">
    GPS: <span id="gps-status" class="err">Esperando...</span><br>
    Rumbo al destino: <span id="bearing-val">--</span>°<br>
    Heading (media): <span id="heading-val">--</span>°<br>
    Flecha: <span id="arrow-val">--</span>°
  </div>

  <div class="log" id="log"></div>

<script>
  var TARGET_LAT = 39.7211;
  var TARGET_LON = 2.91090;

  var userLat = null, userLon = null;
  var targetBearing = 0;

  // Buffer de lecturas del sensor — acumula 1 segundo de lecturas
  var headingBuffer = [];
  var headingMedia = 0;
  var tickCount = 0; // 0-4, cada tick = 1 segundo

  function log(msg) {
    var el = document.getElementById('log');
    var t = new Date().toTimeString().slice(0,8);
    el.innerHTML += '<div>[' + t + '] ' + msg + '</div>';
    el.scrollTop = el.scrollHeight;
  }

  function calcDistancia(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var dLat = (lat2-lat1)*Math.PI/180;
    var dLon = (lon2-lon1)*Math.PI/180;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
            Math.sin(dLon/2)*Math.sin(dLon/2);
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  function calcRumbo(lat1, lon1, lat2, lon2) {
    var dLon = (lon2-lon1)*Math.PI/180;
    var y = Math.sin(dLon)*Math.cos(lat2*Math.PI/180);
    var x = Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180) -
            Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dLon);
    return ((Math.atan2(y,x)*180/Math.PI)+360)%360;
  }

  // Media circular — evita el problema 359°/1° = 180°
  function mediaCircular(angulos) {
    if (angulos.length === 0) return 0;
    var sinSum = 0, cosSum = 0;
    for (var i = 0; i < angulos.length; i++) {
      var rad = angulos[i] * Math.PI / 180;
      sinSum += Math.sin(rad);
      cosSum += Math.cos(rad);
    }
    var media = Math.atan2(sinSum/angulos.length, cosSum/angulos.length) * 180 / Math.PI;
    return (media + 360) % 360;
  }

  function actualizarFlecha(heading) {
    var relativo = (targetBearing - heading + 360) % 360;
    document.getElementById('arrow-wrap').style.transform = 'rotate(' + relativo + 'deg)';
    document.getElementById('arrow-val').textContent = Math.round(relativo);
    document.getElementById('heading-val').textContent = Math.round(heading);
    document.getElementById('bearing-val').textContent = Math.round(targetBearing);
  }

  // Tick cada segundo — calcula media y actualiza flecha cada 5 ticks
  function tick() {
    // Actualizar dots visuales
    for (var i = 0; i < 5; i++) {
      document.getElementById('d'+i).classList.toggle('active', i <= tickCount);
    }

    if (headingBuffer.length > 0) {
      headingMedia = mediaCircular(headingBuffer);
      headingBuffer = []; // limpiar buffer para el siguiente segundo
    }

    tickCount++;
    if (tickCount >= 5) {
      // Actualizar flecha con la media de los últimos 5 segundos
      actualizarFlecha(headingMedia);
      tickCount = 0;
      log('Actualizado — heading media: ' + Math.round(headingMedia) + 'deg rumbo: ' + Math.round(targetBearing) + 'deg');
    }
  }

  // Arrancar tick cada 1 segundo
  setInterval(tick, 1000);

  // GPS
  if (navigator.geolocation) {
    log('Iniciando GPS...');
    navigator.geolocation.watchPosition(
      function(pos) {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        var dist = calcDistancia(userLat, userLon, TARGET_LAT, TARGET_LON);
        targetBearing = calcRumbo(userLat, userLon, TARGET_LAT, TARGET_LON);
        document.getElementById('dist').textContent = Math.round(dist);
        document.getElementById('gps-status').textContent = 'OK';
        document.getElementById('gps-status').className = 'ok';
        if (dist < 20) document.getElementById('arrived').classList.add('visible');
      },
      function(err) {
        document.getElementById('gps-status').textContent = 'ERROR: ' + err.message;
        log('GPS error: ' + err.message);
      },
      { enableHighAccuracy: true, maximumAge: 2000 }
    );
  }

  // Brújula — acumula lecturas en buffer
  function onOrientation(e) {
    if (e.alpha === null) return;
    var heading;
    if (e.webkitCompassHeading !== undefined) {
      heading = e.webkitCompassHeading;
    } else {
      heading = (360 - e.alpha) % 360;
    }
    headingBuffer.push(heading);
  }

  if (window.DeviceOrientationEvent) {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function(s) {
        if (s === 'granted') {
          window.addEventListener('deviceorientationabsolute', onOrientation, true);
          window.addEventListener('deviceorientation', onOrientation);
          log('Brujula iOS: OK');
        }
      });
    } else {
      window.addEventListener('deviceorientationabsolute', onOrientation, true);
      window.addEventListener('deviceorientation', onOrientation);
      log('Brujula Android: escuchando...');
    }
  } else {
    log('Brujula NO disponible');
  }
</script>
</body>
</html>
