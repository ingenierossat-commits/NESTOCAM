<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0c07; --bg2: #1a1208; --border: #3d2e12;
    --amber: #e8a020; --amber2: #f5c842;
    --green: #4caf50; --text: #ffffff; --text-dim: #aaaaaa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Space Mono', monospace;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; gap: 16px;
  }

  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px; letter-spacing: 3px; color: var(--amber);
  }
  .distance {
    font-size: 11px; color: var(--text-dim); letter-spacing: 2px;
  }
  .distance span { color: var(--text); font-size: 20px; }

  .compass-ring {
    width: 260px; height: 260px; border-radius: 50%;
    border: 2px solid var(--border);
    background: radial-gradient(circle at center, #241a0a 0%, #0e0c07 70%);
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.5);
  }
  .compass-ring::before {
    content: ''; position: absolute; inset: 10px;
    border-radius: 50%; border: 1px solid var(--border);
  }

  .cardinal {
    position: absolute; font-size: 12px; font-weight: 700;
  }
  .cardinal.n { top: 14px; left: 50%; transform: translateX(-50%); color: var(--amber); }
  .cardinal.s { bottom: 14px; left: 50%; transform: translateX(-50%); color: var(--text-dim); }
  .cardinal.e { right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }
  .cardinal.w { left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }

  /* FLECHA — origen en centro exacto de la brújula */
  .arrow-wrap {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    transform-origin: 0px 0px;
    transition: transform 0.3s ease;
  }
  /* Punta hacia arriba */
  .arrow-head {
    position: absolute;
    width: 0; height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-bottom: 24px solid var(--amber2);
    left: -10px;
    top: -90px;
    filter: drop-shadow(0 0 6px rgba(245,200,66,0.9));
  }
  .arrow-body-up {
    position: absolute;
    width: 6px; height: 66px;
    background: linear-gradient(to top, var(--amber) 0%, var(--amber2) 100%);
    border-radius: 3px;
    left: -3px; top: -90px;
    margin-top: 24px;
    filter: drop-shadow(0 0 4px rgba(232,160,32,0.6));
  }
  /* Cola hacia abajo */
  .arrow-body-down {
    position: absolute;
    width: 6px; height: 50px;
    background: linear-gradient(to bottom, #666 0%, transparent 100%);
    border-radius: 3px;
    left: -3px; top: 0px;
  }

  .compass-center {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 14px rgba(232,160,32,0.9);
    z-index: 10;
  }

  .info-box {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 20px;
    font-size: 10px; color: var(--text-dim);
    text-align: center; line-height: 2.2; width: 280px;
  }
  .info-box span { color: var(--amber); font-weight: 700; }
  .info-box .ok { color: var(--green); }
  .info-box .err { color: #e53935; }

  .arrived {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px; letter-spacing: 4px; color: var(--green);
    text-shadow: 0 0 20px rgba(76,175,80,0.5);
    display: none;
  }
  .arrived.visible { display: block; }

  .log {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px;
    font-size: 9px; color: var(--text-dim);
    width: 280px; max-height: 100px; overflow-y: auto;
    line-height: 1.8;
  }
</style>
</head>
<body>

  <div class="title">DESTINO: Campos</div>
  <div class="distance">DISTANCIA: <span id="dist">--</span> m</div>

  <div class="compass-ring">
    <span class="cardinal n">N</span>
    <span class="cardinal s">S</span>
    <span class="cardinal e">E</span>
    <span class="cardinal w">O</span>

    <div class="arrow-wrap" id="arrow-wrap">
      <div class="arrow-body-down"></div>
      <div class="arrow-body-up"></div>
      <div class="arrow-head"></div>
    </div>

    <div class="compass-center"></div>
  </div>

  <div class="arrived" id="arrived">¡LLEGASTE!</div>

  <div class="info-box">
    GPS: <span id="gps-status" class="err">Esperando...</span><br>
    Rumbo al destino: <span id="bearing-val">--</span>°<br>
    Heading dispositivo: <span id="heading-val">--</span>°<br>
    Flecha relativa: <span id="arrow-val">--</span>°
  </div>

  <div class="log" id="log"></div>

<script>
  // ── DESTINO FIJO ──
  const TARGET_LAT = 39.7211;
  const TARGET_LON = 2.91090;

  let userLat = null, userLon = null;
  let deviceHeading = 0;
  let targetBearing = 0;

  // ── LOG ──
  function log(msg) {
    var el = document.getElementById('log');
    var d = new Date();
    var t = d.toTimeString().slice(0,8);
    el.innerHTML += '<div>[' + t + '] ' + msg + '</div>';
    el.scrollTop = el.scrollHeight;
  }

  // ── DISTANCIA ──
  function calcDistancia(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
            Math.sin(dLon/2)*Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // ── RUMBO ──
  function calcRumbo(lat1, lon1, lat2, lon2) {
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
    var x = Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180) -
            Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dLon);
    return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
  }

  // ── ACTUALIZAR FLECHA ──
  function actualizarFlecha() {
    var relativo = (targetBearing - deviceHeading + 360) % 360;
    document.getElementById('arrow-wrap').style.transform = 'rotate(' + relativo + 'deg)';
    document.getElementById('arrow-val').textContent = Math.round(relativo);
    document.getElementById('bearing-val').textContent = Math.round(targetBearing);
  }

  // ── GPS ──
  if (navigator.geolocation) {
    log('Iniciando GPS...');
    navigator.geolocation.watchPosition(
      function(pos) {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        var dist = calcDistancia(userLat, userLon, TARGET_LAT, TARGET_LON);
        targetBearing = calcRumbo(userLat, userLon, TARGET_LAT, TARGET_LON);

        document.getElementById('dist').textContent = Math.round(dist);
        document.getElementById('gps-status').textContent = 'OK (' + userLat.toFixed(5) + ', ' + userLon.toFixed(5) + ')';
        document.getElementById('gps-status').className = 'ok';

        if (dist < 20) {
          document.getElementById('arrived').classList.add('visible');
        }
        actualizarFlecha();
        log('GPS OK — dist:' + Math.round(dist) + 'm rumbo:' + Math.round(targetBearing) + 'deg');
      },
      function(err) {
        document.getElementById('gps-status').textContent = 'ERROR: ' + err.message;
        log('GPS ERROR: ' + err.message);
      },
      { enableHighAccuracy: true, maximumAge: 2000 }
    );
  }

  // ── BRÚJULA — máxima compatibilidad Android ──
  function initBrujula() {
    if (!window.DeviceOrientationEvent) {
      log('DeviceOrientation NO disponible');
      return;
    }

    // iOS 13+ necesita permiso explícito
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function(state) {
        if (state === 'granted') {
          window.addEventListener('deviceorientation', onOrientation);
          log('Permiso brujula iOS: OK');
        } else {
          log('Permiso brujula iOS: DENEGADO');
        }
      }).catch(function(e) { log('Error permiso: ' + e); });
    } else {
      // Android — sin permiso, escuchar directamente
      // Probar primero absolute (más fiable en Android)
      window.addEventListener('deviceorientationabsolute', function(e) {
        if (e.alpha !== null) {
          // deviceorientationabsolute da heading real respecto al norte
          deviceHeading = (360 - e.alpha) % 360;
          document.getElementById('heading-val').textContent = Math.round(deviceHeading);
          actualizarFlecha();
        }
      }, true);

      // Fallback a deviceorientation normal
      window.addEventListener('deviceorientation', function(e) {
        if (e.alpha === null) return;
        var heading;
        if (e.webkitCompassHeading !== undefined) {
          // Safari / algunos Android — da heading directo
          heading = e.webkitCompassHeading;
        } else {
          heading = (360 - e.alpha) % 360;
        }
        deviceHeading = heading;
        document.getElementById('heading-val').textContent = Math.round(heading);
        actualizarFlecha();
      });

      log('Brujula Android: escuchando...');
    }
  }

  initBrujula();
</script>
</body>
</html>
